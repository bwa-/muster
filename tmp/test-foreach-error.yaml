apiVersion: muster.giantswarm.io/v1alpha1
kind: Workflow
metadata:
  name: test-foreach-error
  namespace: default
spec:
  description: "Test workflow to verify forEach error messages show tool name and context"
  
  args:
    test_query:
      type: string
      required: true
      description: "Test query parameter"
  
  steps:
    - id: test_foreach_with_bad_tool
      forEach:
        items: ["item1", "item2", "item3"]
        step:
          id: failing_step
          tool: x_nonexistent_tool_for_testing
          args:
            query: "{{.input.test_query}}"
            item_value: "{{.item}}"
          store: true
          allowFailure: false
